<html>

<head>

        function setFocusToTextBox() {

        }
    </script>
</head>

    <form action='/login' method='POST'>
        Login PIN: <input id="pw" size="2" type='password' name='PASSWORD' placeholder='****'>
        <input type='submit' name='SUBMIT' value='Submit'>
    </form>
</body>

</html>
